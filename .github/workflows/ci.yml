name: GeoSI v2 CI/CD Pipeline

# ════════════════════════════════════════════════════════════════════
# GeoSI v2 — GitHub Actions CI/CD (FR-9.3)
# Pipeline: lint → type-check → unit tests → eval gate → security → build → push
# ════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main, develop, "feature/**", "phase/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run RAGAS evaluation gate"
        type: boolean
        default: true

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/geosi-server

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Lint ──────────────────────────────────────────────────
  lint:
    name: "Lint & Format Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff black isort

      - name: Run ruff
        run: ruff check . --output-format=github

      - name: Run black (check only)
        run: black --check --diff .

      - name: Run isort (check only)
        run: isort --check-only --diff .

  # ── Stage 2: Type Check ────────────────────────────────────────────
  type_check:
    name: "Type Check (mypy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mypy types-passlib types-python-jose

      - name: Run mypy
        run: |
          mypy geosi_engine/ geosi_server/ geosi_mcp/ geosi_data/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --warn-return-any \
            --show-error-codes

  # ── Stage 3: Unit Tests ────────────────────────────────────────────
  unit_tests:
    name: "Unit Tests (pytest)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: geosi_test
          POSTGRES_USER: geosi
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://geosi:testpass@localhost:5432/geosi_test
      GEOSI_ENV: test
      GEOSI_API_KEYS: test_key_123
      GEOSI_ADMIN_KEYS: admin_key_123
      GEOSI_MCP_TOKEN: ""

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system GIS deps
        run: |
          sudo apt-get update -qq
          # NOTE on GDAL and Python wheels:
          # rasterio==1.4.3, fiona==1.10.1, pyproj==3.7.0 are shipped as
          # manylinux2014 wheels that STATICALLY bundle their own libgdal.
          # This means apt-get install libgdal-dev does NOT control which
          # GDAL version the Python code links against at runtime — the wheel
          # does. The apt packages below are only needed for:
          #   - PROJ/GEOS system headers (some source builds need them)
          #   - gdal-bin CLI tools (e.g., ogrinfo, gdal_translate)
          # Do NOT pin libgdal-dev to a specific version here; it would give
          # a false sense of version control that doesn't apply to the wheels.
          # Use the verification step below to see what GDAL is actually linked.
          sudo apt-get install -y --no-install-recommends \
            libproj-dev \
            libgeos-dev \
            gdal-bin      # CLI tools only — not the Python-linked libgdal

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" || pip install \
            pytest pytest-cov pytest-asyncio pytest-mock \
            fastapi httpx \
            geopandas shapely fiona rasterio pyproj \
            sqlalchemy geoalchemy2 psycopg2-binary alembic \
            qdrant-client sentence-transformers rank-bm25 \
            scikit-learn numpy pandas \
            opentelemetry-sdk \
            pydantic python-jose passlib python-multipart

      - name: Verify runtime GDAL version (informational)
        # Prints the GDAL version the installed wheels actually link against.
        # This is the real version in effect — not the apt-installed one.
        # Check these logs if you see GDAL-related runtime errors.
        run: |
          python -c "
          import rasterio, fiona, pyproj
          print(f'rasterio version : {rasterio.__version__}')
          print(f'rasterio GDAL    : {rasterio.__gdal_version__}')
          print(f'fiona version    : {fiona.__version__}')
          print(f'fiona GDAL       : {fiona.__gdal_version__}')
          print(f'pyproj version   : {pyproj.__version__}')
          print(f'PROJ data        : {pyproj.datadir.get_data_dir()}')
          "

      - name: Run Alembic migrations
        # Bug #4 fix: remove continue-on-error — schema drift MUST fail the build.
        # If your ORM models and Alembic migrations are out of sync, CI catches it here.
        # If you deliberately need to skip (e.g., no DB in this CI job), use
        # a conditional on a job-level env var instead of swallowing the error silently.
        env:
          DATABASE_URL: postgresql://geosi:test@localhost:5432/geosi_test
        run: PYTHONPATH=. alembic upgrade head

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/ \
            --tb=short \
            --cov=geosi_engine \
            --cov=geosi_server \
            --cov=geosi_mcp \
            --cov=geosi_data \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -q

      - name: Upload coverage report
        uses: codecov/codecov-action@v2
        with:
          file: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── Stage 4: Evaluation Gate (FR-7.2) ─────────────────────────────
  eval_gate:
    name: "RAGAS Evaluation Gate (FR-7.2)"
    runs-on: ubuntu-latest
    needs: [unit_tests]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_eval) ||
      (github.ref == 'refs/heads/main' && github.event_name == 'push')
    env:
      GEOSI_ENV: test
      GEOSI_API_KEYS: test_key_123
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install evaluation deps
        run: |
          pip install ragas datasets openai

      - name: Run golden set load test (always passes)
        run: |
          PYTHONPATH=. python -c "
          from tests.golden_set import GOLDEN_SET, load_golden_set
          assert len(GOLDEN_SET) == 150, f'Expected 150 queries, got {len(GOLDEN_SET)}'
          planning = load_golden_set('planning')
          assert len(planning) == 50, f'Expected 50 planning queries, got {len(planning)}'
          print(f'Golden set OK: {len(GOLDEN_SET)} queries across all agent scopes.')
          "

      - name: Run RAGAS heuristic evaluation (no LLM required)
        run: |
          PYTHONPATH=. python -c "
          from tests.golden_set import load_golden_set
          from geosi_engine.evaluation.ragas_runner import RAGASRunner
          runner = RAGASRunner(engine=None)
          queries = load_golden_set('research')[:10]
          summary = runner.run(queries)
          print(f'Run ID: {summary.run_id}')
          print(f'Queries: {summary.total_queries}')
          print(f'Mean faithfulness (heuristic): {summary.mean_faithfulness:.3f}')
          print(f'Mean context precision: {summary.mean_context_precision:.3f}')
          print('Heuristic eval complete — RAGAS gate skipped (no LLM keys in test env)')
          "

  # ── Stage 5: Security Scan ─────────────────────────────────────────
  security_scan:
    name: "Security Scan (bandit + safety)"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install bandit safety

      - name: Run bandit (SAST)
        run: |
          bandit -r geosi_engine/ geosi_server/ geosi_mcp/ geosi_data/ \
            -x tests/ \
            -ll \
            -f json \
            -o bandit-report.json || true
          python -c "
          import json, sys
          report = json.load(open('bandit-report.json'))
          highs = [i for i in report.get('results', []) if i['issue_severity'] == 'HIGH']
          if highs:
              for h in highs:
                  print(f'HIGH: {h[\"filename\"]}:{h[\"line_number\"]} — {h[\"issue_text\"]}')
              sys.exit(1)
          print(f'Bandit: {len(report.get(\"results\", []))} issues found, 0 HIGH severity.')
          "

      - name: Run safety (dependency CVE check)
        # Deliberate policy: safety CAN fail this build on HIGH/CRITICAL CVEs.
        # This mirrors the bandit step above (fails on HIGH severity findings).
        #
        # If a specific CVE in a heavy dep (e.g. torch, ragas) has been triaged
        # and is acceptable (no fix available, not exploitable in our context),
        # suppress it explicitly with: --ignore CVE-XXXX-YYYY
        # Do NOT use --continue-on-error or || true — that silences all findings
        # forever and is structurally identical to the fail-open patterns this
        # pass just closed everywhere else.
        #
        # Known ignored CVEs (add with justification):
        #   (none yet — all CVEs must be reviewed before adding to this list)
        run: safety check

      - name: Upload bandit report
        uses: actions/upload-artifact@v2
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ── Stage 6: Docker Build ──────────────────────────────────────────
  docker_build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [unit_tests, security_scan]
    steps:
      - uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.server
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 7: Integration Tests (on main only) ─────────────────────
  integration_tests:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    needs: [docker_build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v2

      - name: Start stack
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=ci_test_pass" >> .env
          echo "NEO4J_PASSWORD=ci_neo4j_pass" >> .env
          echo "REDIS_PASSWORD=ci_redis_pass" >> .env   # Required — :? guard added in Bug #3 fix
          echo "GEOSI_API_KEYS=ci_api_key" >> .env
          echo "GEOSI_ADMIN_KEYS=ci_admin_key" >> .env
          docker compose up -d postgres qdrant redis geosi_server
          sleep 30

      - name: Run smoke tests
        run: |
          curl -f http://localhost:8000/health || exit 1
          curl -f -H "X-API-Key: ci_api_key" http://localhost:8000/stats || exit 1

      - name: Stop stack
        if: always()
        run: docker compose down -v
