[project]
name = "geosi"
version = "2.0.0-dev"
description = "GeoSI — Autonomous Geospatial Intelligence Platform"
requires-python = ">=3.11,<3.13"
readme = "README.md"

dependencies = [
    # --- Web / API ---
    "fastapi>=0.115.12",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "python-jose[cryptography]==3.3.0",   # JWT auth (G2 fix)
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.20",

    # --- Data layer ---
    "sqlalchemy==2.0.36",
    "geoalchemy2==0.16.0",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",                    # replaces create_all() (G9 fix)
    "neo4j==5.27.0",                      # Phase 9

    # --- Knowledge / RAG layer (KEEP existing pins where already correct) ---
    "qdrant-client==1.12.1",
    "sentence-transformers==3.3.1",
    "rank-bm25==0.2.2",

    # --- GIS libraries ---
    "geopandas==1.0.1",
    "shapely==2.0.6",
    "fiona==1.10.1",
    "rasterio==1.4.3",
    "pyproj==3.7.0",

    # --- AI / ML libraries ---
    "torch==2.5.1",
    "scikit-learn==1.6.0",
    "numpy==2.2.1",
    "pandas==2.2.3",

    # --- LLM providers ---
    "anthropic==0.42.0",

    # --- Observability (Phase 2) ---
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp==1.29.0",

    # --- Evaluation (Phase 2) ---
    "ragas==0.2.9",

    # --- Utilities ---
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "tenacity==9.0.0",                    # retry/circuit-breaker support for Supervisor
    "pyahocorasick==2.1.0",               # O(T) multi-pattern scan for guardrails (vs O(P×T))
]

[project.optional-dependencies]
# Optional fast path for geosi_mcp/stdio_server.py (falls back to a built-in stdio loop)
mcp = [
    "fastmcp>=2.1.2",
]
dev = [
    "ruff==0.8.4",
    "mypy==1.14.0",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-asyncio==0.25.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.1",                      # FastAPI test client
    "pre-commit==4.0.1",
    "types-requests==2.32.0.20241016",
]

[build-system]
requires = ["scikit-build-core>=0.8.0", "pybind11>=2.12.0"]
build-backend = "scikit_build_core.build"

# ---------------------------------------------------------------------------
# Ruff — lint + import sort
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["geosi_engine", "geosi_rag", "geosi_knowledge", "geosi_data", "geosi_server", "geosi_mcp", "geosi_eval"]

[tool.ruff.per-file-target-version]
# Bundled in the QGIS plugin: must run on the Python QGIS ships (3.9 on 3.28 LTR)
"geosi_plugin/**" = "py39"
"geosi_engine/**" = "py39"
"geosi_data/**" = "py39"
"geosi_rag/**" = "py39"
"geosi_knowledge/**" = "py39"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                 # isort
    "B",                 # bugbear (catches things like mutable default args)
    "S",                 # bandit-style security rules — will flag f-string SQL, eval() (G4/G12)
    "UP",                # pyupgrade
    "C90",               # mccabe complexity
]
ignore = [
    "E501",  # line length handled by black (120)
    # Security rules are enforced by bandit in CI (security_scan job), where each
    # reviewed site carries a `# nosec <id>` justification ruff does not read.
    "S310",  # urlopen on fixed https endpoints (Nominatim, Overpass, Ollama)
    "S608",  # SQL identifiers pass TableAllowList.validate_and_quote()
    "S102",  # exec only in ASTGuard.safe_exec, after AST validation
    # Known tech debt: 16 planner/executor functions exceed complexity 12.
    # Refactor separately; not a correctness gate.
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests
# Plugin-bundled code runs on the Python QGIS ships (3.9 on 3.28 LTR). Keep
# typing.Optional/Dict there: PEP 604/585 rewrites can break at runtime when
# annotations are evaluated (pydantic, get_type_hints).
"geosi_plugin/**" = ["UP006", "UP035", "UP045"]
"geosi_engine/**" = ["UP006", "UP035", "UP045"]
"geosi_data/**" = ["UP006", "UP035", "UP045"]
"geosi_rag/**" = ["UP006", "UP035", "UP045"]
"geosi_knowledge/**" = ["UP006", "UP035", "UP045"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in defaults by design
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.File", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # not the local alembic/ migrations dir
known-first-party = ["geosi_engine", "geosi_data", "geosi_plugin", "geosi_rag", "geosi_knowledge", "geosi_server", "geosi_mcp", "geosi_eval", "tests"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 120
target-version = ["py39"]
extend-exclude = "QGIS_AI-Agent"

[tool.isort]
profile = "black"
line_length = 120
skip = ["QGIS_AI-Agent"]
known_third_party = ["alembic"]
known_first_party = ["geosi_engine", "geosi_data", "geosi_plugin", "geosi_rag", "geosi_knowledge", "geosi_server", "geosi_mcp", "geosi_eval", "tests"]

# ---------------------------------------------------------------------------
# Mypy — type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["migrations/", "tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["qgis.*", "processing.*", "osgeo.*"]
ignore_missing_imports = true  # QGIS bindings have no type stubs

# ---------------------------------------------------------------------------
# Pytest — unit + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated unit tests",
    "integration: requires PostGIS/Qdrant/etc",
    "agent: agent-specific behavior tests (permission, guardrail, schema validation)",
]

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
# Per-agent module target from PRD §14: >= 70% coverage per agent
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
