# GeoSI v2 — Nginx Reverse Proxy Config (FR-9)
# ════════════════════════════════════════════════════════════════════
# - No wildcard CORS (FR security requirement)
# - Rate limiting: 100 req/s burst per IP
# - Proxy to geosi_server:8000
# - MCP endpoint at /mcp/
# ════════════════════════════════════════════════════════════════════

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hide Nginx version
    server_tokens off;

    # ── Logging ───────────────────────────────────────────────────
    log_format main  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" '
                     'rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    # ── Performance ───────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    gzip            on;
    gzip_types      application/json text/plain application/javascript;
    gzip_min_length 1024;

    # ── Rate limiting ─────────────────────────────────────────────
    # 100 requests/s burst with 200 delayed queue — protects from DoS
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m  rate=100r/s;
    limit_req_zone  $binary_remote_addr  zone=mcp_limit:10m  rate=30r/s;
    limit_req_log_level warn;

    # ── Upstream ──────────────────────────────────────────────────
    upstream geosi_backend {
        server geosi_server:8000;
        keepalive 32;
    }

    # ── Main server ───────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Redirect HTTP → HTTPS in production; keep HTTP for dev
        # For production, add:
        #   return 301 https://$host$request_uri;

        client_max_body_size 100M;    # Allow large raster uploads
        proxy_read_timeout   300s;    # Long-running GIS operations

        # ── CORS — whitelist-only, never wildcard ─────────────────
        # Environment-driven via GEOSI_ALLOWED_ORIGINS in app.py
        # Nginx is a secondary layer; primary enforcement is FastAPI

        # ── Health ────────────────────────────────────────────────
        location = /health {
            proxy_pass http://geosi_backend;
            proxy_set_header Host $host;
            limit_req zone=api_limit burst=20 nodelay;
            access_log off;
        }

        # ── API routes ────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=200 delay=100;

            proxy_pass         http://geosi_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        keep-alive;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── MCP server (stricter rate limit) ──────────────────────
        location /mcp/ {
            limit_req zone=mcp_limit burst=50 delay=10;

            proxy_pass         http://geosi_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── OpenAPI docs ──────────────────────────────────────────
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://geosi_backend;
            proxy_set_header Host $host;
        }

        # ── Block all other paths ─────────────────────────────────
        location / {
            proxy_pass http://geosi_backend;
            proxy_set_header Host $host;
            limit_req zone=api_limit burst=50;
        }
    }
}
